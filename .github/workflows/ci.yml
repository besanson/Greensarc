name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples benchmarks
      - name: Format check
        run: ruff format --check src tests examples benchmarks
      - name: Type check
        run: mypy src/green_sarc benchmarks
      - name: Test
        run: pytest -q
      - name: Verify test count matches the paper (§6 states 147 passed)
        run: |
          out=$(pytest -q 2>&1 | tail -1)
          echo "$out"
          echo "$out" | grep -q "147 passed" || { echo "Test-count drift: paper §6 says 147 passed, got: $out"; exit 1; }
      - name: Verify benchmark reference
        if: matrix.python-version == '3.12'
        run: make verify
