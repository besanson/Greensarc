[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-sarc"
version = "0.4.0"
description = "Green SARC — predictive cost + carbon governance layer for agentic AI systems, framework-agnostic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "G. Besanson" }]
keywords = ["finops", "greenops", "carbon", "agents", "governance", "sarc", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-sdk>=1.20"]
prometheus = ["prometheus-client>=0.19"]
redis = ["redis>=5"]
# Live LiteLLM price + ElectricityMaps carbon loaders are stdlib-only (urllib);
# this extra is intentionally empty, kept as a stable name for forward-compat.
feeds = []
# SARC composition layer. `sarc-governance` is not yet on PyPI and PyPI forbids
# direct VCS (`git+https`) URLs in published metadata, so this extra is kept as a
# stable name only; install the dependency manually until it is released:
#   pip install "sarc-governance @ git+https://github.com/besanson/sarc-governance"
sarc = []
tiktoken = ["tiktoken>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.12",
    "mypy==1.15.0",
    "prometheus-client>=0.19",
    "fakeredis[lua]>=2.20",
    "numpy>=1.26",  # test/benchmark data generation only; the library core is numpy-free
]

[project.scripts]
green-sarc = "green_sarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
green_sarc = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
