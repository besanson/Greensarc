[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green-sarc"
version = "0.2.0"
description = "Green SARC — predictive cost + carbon governance layer for agentic AI systems, framework-agnostic"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "G. Besanson" }]
keywords = ["finops", "greenops", "carbon", "agents", "governance", "sarc", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
otel = ["opentelemetry-sdk>=1.20"]
sarc = ["sarc-governance @ git+https://github.com/besanson/sarc-governance"]
tiktoken = ["tiktoken>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.12",
    "mypy==1.15.0",
]

[project.scripts]
green-sarc = "green_sarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
green_sarc = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
