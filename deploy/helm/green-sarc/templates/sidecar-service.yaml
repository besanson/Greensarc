{{- if .Values.sidecar.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "green-sarc.fullname" . }}-sidecar
  labels:
    {{- include "green-sarc.labels" . | nindent 4 }}
    app.kubernetes.io/component: sidecar
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "green-sarc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sidecar
{{- end }}
